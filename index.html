<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Incheon Sky Tracker</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:sans-serif;
    }

    body{
      background:linear-gradient(to bottom,#020617,#0f172a,#082f49);
      color:white;
      min-height:100vh;
      overflow-x:hidden;
      transition:0.4s;
    }

    body.light{
      background:linear-gradient(to bottom,#dbeafe,#ffffff,#e0f2fe);
      color:#111827;
    }

    header{
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
    }

    h1{
      font-size:40px;
      color:#38bdf8;
    }

    .buttons{
      display:flex;
      gap:10px;
    }

    button{
      padding:10px 15px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:15px;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
    }

    .container{
      display:grid;
      grid-template-columns:1fr 2fr;
      gap:20px;
      padding:20px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:25px;
      padding:20px;
      backdrop-filter:blur(10px);
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    input{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      margin-top:15px;
      font-size:16px;
    }

    .flight{
      margin-top:15px;
      padding:15px;
      border-radius:15px;
      background:rgba(255,255,255,0.05);
      cursor:pointer;
      transition:0.3s;
    }

    .flight:hover{
      background:rgba(56,189,248,0.2);
      transform:translateY(-3px);
    }

    .sky{
      height:450px;
      position:relative;
      overflow:hidden;
      border-radius:25px;
      background:linear-gradient(to bottom,#0f172a,#082f49);
    }

    .plane{
      position:absolute;
      top:50%;
      left:-150px;
      font-size:90px;
      animation:fly 12s linear infinite;
    }

    @keyframes fly{
      0%{
        left:-150px;
      }

      100%{
        left:110%;
      }
    }

    .info{
      position:absolute;
      bottom:20px;
      left:20px;
      background:rgba(0,0,0,0.4);
      padding:15px;
      border-radius:15px;
      backdrop-filter:blur(8px);
    }

    .detail p{
      margin-top:10px;
      font-size:17px;
    }

    footer{
      text-align:center;
      padding:20px;
      opacity:0.7;
    }

    @media(max-width:900px){
      .container{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>INCHEON SKY TRACKER</h1>
      <p>인천공항 실시간 여객기 운항 시스템</p>
    </div>

    <div class="buttons">
      <button onclick="toggleTheme()">🌙 야간모드</button>
      <button onclick="toggleMusic()">🎵 음악모드</button>
    </div>
  </header>

  <div class="container">

    <div>

      <div class="card">
        <h2>✈️ 항공편 검색</h2>

        <input
          type="text"
          id="search"
          placeholder="항공편 / 항공사 검색"
          onkeyup="searchFlights()"
        >
      </div>

      <div class="card" style="margin-top:20px;">
        <h2>📡 운항 현황</h2>

        <div id="flightList"></div>
      </div>

    </div>

    <div>

      <div class="card sky">

        <div class="plane">✈️</div>

        <div class="info">
          <h2 id="flightId">KE085</h2>
          <p id="position">태평양 상공</p>
        </div>

      </div>

      <div class="card detail" style="margin-top:20px;">
        <h2>🛫 상세 정보</h2>

        <p><strong>항공사:</strong> <span id="airline"></span></p>
        <p><strong>기종:</strong> <span id="aircraft"></span></p>
        <p><strong>출발지:</strong> <span id="departure"></span></p>
        <p><strong>목적지:</strong> <span id="arrival"></span></p>
        <p><strong>상태:</strong> <span id="status"></span></p>

      </div>

    </div>

  </div>

  <footer>
    Incheon International Airport Inspired Flight Tracker
  </footer>

  <audio id="bgm" loop>
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_ba4b63b2fd.mp3" type="audio/mpeg">
  </audio>

  <script>

    const flights = [
      {
        id:"KE085",
        airline:"대한항공",
        aircraft:"Boeing 777",
        departure:"인천(ICN)",
        arrival:"뉴욕(JFK)",
        status:"운항 중",
        position:"태평양 상공"
      },

      {
        id:"OZ101",
        airline:"아시아나항공",
        aircraft:"Airbus A350",
        departure:"도쿄(NRT)",
        arrival:"인천(ICN)",
        status:"착륙 예정",
        position:"서해 상공"
      },

      {
        id:"LJ021",
        airline:"진에어",
        aircraft:"B737-800",
        departure:"인천(ICN)",
        arrival:"제주(CJU)",
        status:"탑승 중",
        position:"게이트 14"
      }
    ];

    let musicOn = false;

    function renderFlights(list){

      const flightList = document.getElementById("flightList");

      flightList.innerHTML = "";

      list.forEach(flight => {

        flightList.innerHTML += `
          <div class="flight" onclick="showFlight('${flight.id}')">

            <h3>${flight.id}</h3>

            <p>${flight.airline}</p>

            <p>${flight.departure} → ${flight.arrival}</p>

            <strong>${flight.status}</strong>

          </div>
        `;
      });
    }

    function showFlight(id){

      const flight = flights.find(f => f.id === id);

      document.getElementById("flightId").innerText = flight.id;
      document.getElementById("position").innerText = flight.position;

      document.getElementById("airline").innerText = flight.airline;
      document.getElementById("aircraft").innerText = flight.aircraft;
      document.getElementById("departure").innerText = flight.departure;
      document.getElementById("arrival").innerText = flight.arrival;
      document.getElementById("status").innerText = flight.status;
    }

    function searchFlights(){

      const keyword = document
        .getElementById("search")
        .value
        .toLowerCase();

      const filtered = flights.filter(f =>
        f.id.toLowerCase().includes(keyword) ||
        f.airline.toLowerCase().includes(keyword)
      );

      renderFlights(filtered);
    }

    function toggleTheme(){
      document.body.classList.toggle("light");
    }

    function toggleMusic(){

      const bgm = document.getElementById("bgm");

      musicOn = !musicOn;

      if(musicOn){
        bgm.play();
      }else{
        bgm.pause();
      }
    }

    renderFlights(flights);

    showFlight("KE085");

  </script>

</body>
</html>
